<!DOCTYPE html>
<html lang="en">

<head>

    <title>Bank Account Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- //Create Account
        //Display account information
        //Deposit Money
        //Withdrawal of money
        //Check balance -->
    <div class="container">
    
            <h3>Create Account</h3>
            <form>
                <label for="Name">Account Holder Name</label>
                <input type="text" name="Name" id="HolderName">

                <label for="Account-Number">Account Number</label>
                <input type="Number" name="Number" id="AccNumber">

                <label for="Number">Initial Balance</label>
                <input type="Number" name="Balance" id="HolderName">

                <button>Create Account</button>

            </form>
        
        <hr>
        <h3>Display Account Information</h3>
              <form>
                <label for="Name">Account Holder Name</label>
                <input type="text" name="Name" id="HolderName">

                <label for="Account-Number">Account Number</label>
                <input type="Number" name="Number" id="AccNumber">

                <button>Show Balance</button>

                <label for="Number">Available Balance</label>
                <input type="Number" name="Balance" id="HolderName"> 

            </form>
        
        <hr>
        <h3>Deposit Money</h3>
        <hr>
        <h3>Withdraw Money</h3>
        <hr>
        <h3>Check balance</h3>
        <hr>
    </div>
    <script src="script.js"></script>
</body>

</html>
