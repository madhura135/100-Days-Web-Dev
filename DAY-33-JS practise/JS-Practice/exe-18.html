<!-- 2. Create a website which is capable of storing bookmarks of your favorite websites using href.
3. Repeat Q2 using event listeners. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS bookmarks</title>
</head>
<body>
    Click  below buttons to visit page
    <button id="g">Google</button>
    <hr>
    <button id="f">Facebook</button>
    <hr>
    <button id="a">Amazon</button>
    <script>
        let hook1= document.getElementById('g');
        hook1.addEventListener("click",function(){
             window.open("https://www.google.com");
        })
          let hook2= document.getElementById('f');
        hook2.addEventListener("click",function(){
             window.open("https://www.facebook.com");
        })
          let hook3= document.getElementById('a');
        hook3.addEventListener("click",function(){
             window.open("https://www.amazon.com");
        })

    </script>
</body>
</html>
