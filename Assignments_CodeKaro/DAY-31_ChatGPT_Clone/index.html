<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clone-Chat_GPT</title>
  <link rel="stylesheet" href="./output.css" />
</head>

<body class="text-black font-sans">
  <div class="flex min-h-screen w-full bg-gray-50 gap-4">
    <div class="w-[20vw] bg-gray-100 text-white p-4 flex flex-col">
      <div class="flex flex-row items-center gap-[50px]">
        <img src="./assets/chatgpt-icon.svg" alt="chat-gpt-icon" class="h-[40px] w-[40px] justify-start" />
        <p class="text-black font-bold">ChatGPT</p>
        <div class="flex flex-row items-end gap-2 m-2.5">
          <img src="./assets/search.png" alt="search-icon" class="h-[30px] w-[30px] justify-end" />
          <img src="./assets/Layout-Right-Sidebar--Streamline-Plump.png" alt="sidebar-toggle"
            class="h-[30px] w-[30px] justify-end" />
        </div>
      </div>
      <!-- New chat -->
      <div class="flex flex-row items-end gap-2 mt-[40px] ml-0">
        <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bg-gray-100 text-black">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        <p class="text-black font-sans">New chat</p>
      </div>
      <!-- Scheduled -->
      <div class="flex flex-row items-end gap-2 mt-[15px] ml-0">
        <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bg-gray-100 text-black">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <p class="text-black font-sans">Scheduled</p>
      </div>
      <!-- library -->
      <div class="flex flex-row items-end gap-2 mt-[15px] ml-0">
        <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bg-gray-100 text-black">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </svg>
        <p class="text-black font-sans">Picture/Sticker</p>
      </div>
      <div class="w-[80vw] p-4"></div>
    </div>
</body>

</html>
