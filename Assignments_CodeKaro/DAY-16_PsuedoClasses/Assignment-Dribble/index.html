<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-Dribble</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo-img">
            <img src="./music.png">
        </div>
        <div class="search-bar">
            <input id="search-input" type="text" placeholder="What are you looking for ?">
            <div class="find-container">
                <img src="./find.png" class="glass" alt="search">
            </div>
        </div>
        <div class="nav-elements">
            <a href="#">Explore</a>
            <a href="#">Hire Talent</a>
            <a href="#">Get hired</a>
            <a href="#">Community</a>
        </div>
        <div class="right-btn">
            <button id="R-btn-1">Sign up</button>
            <button id="R-btn-2">Log in</button>
        </div>
    </nav>
    <section class="sub-nav">
        <img id="discount-tag" src="./discount-tag.png" alt="discount-tag">
        <div id="wel-code">
            Get 20% off your first payment for design and development services on Dribbble. Use code
            WELCOME20 🎉
        </div>
        <button id="get-started-btn">Get started</button>
    </section>
    <div class="content">
        <p class="content-heading">Design course landing page — Untitled UI</p>
        <div class="profile-flex">
            <img id="girl-dp" src="./girl-dp.jpg" alt="girl">
            <div class="dp-content">
                <p id="name">Nancy Peter</p>
                <p id="follow">Follow</p>
            </div>
            <div class="profile-l-s">
                <div class="heart-div">
                    <img id="heart" src="./heart.png" alt="heart">
                </div>
                <div class="save-div">
                    <img id="save" src="./bookmark.png" alt="save-bookmark">
                </div>
                <button id="get-in-touch">Get in touch</button>
            </div>
        </div>
        <div class="banner-card">
            <img class="banner-img" src="./main-img.png" alt="hall-img">
        </div>


    </div>

</body>

</html>
