<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <style>
        .container {
            margin: 100px auto;
            background-color: rgba(128, 128, 128, 0.363);
            width: 200px;
            height: 150px;
            border-radius: 12px;
            padding: 20px;
        }

        .btn {
            margin: 30px auto;
            padding: 20px;

        }

        button {
            background-color: rgba(244, 163, 56, 0.736);
            font-size: small;
            font-weight: bold;
            border-radius: 12px;
            border: 2px solid orange;
            padding: 11px;
            color: white;
        }

        button:hover {

            color: dark orangered;

            background-color: rgba(168, 112, 39, 0.736);
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="content">
            Click the Button to Change the Background Color!
        </div>
        <div class="btn">
            <button onclick="changeColor()">Change Color</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
