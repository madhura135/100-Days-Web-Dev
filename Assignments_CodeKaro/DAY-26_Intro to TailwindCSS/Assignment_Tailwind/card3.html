<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Card-3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-lime-50 flex justify-center ">
    <div class="bg-lime-100 flex-col justify-center mt-2.5 p-5 w-[350px] rounded-2xl border border-lime-500">
        <p class="text-center m-1 p-1">
            📞

        </p>
        <p>
        <h1 class="text-2xl font-bold text-center">Phone number</h1>
        </p>
        <p class="text-[15px] text-center p-2.5 m-1.5 ">Would you like a new OpenPhone number, or
            want to port your existing number over?</p>
        <div class="flex-col gap-2 m-1.5 justify-center items-center">
            <button class="flex justify-between  bg-lime-300 m-2.5 w-[250px] p-1 hover:bg-lime-400">🎁 Brand new number <span>→</span></button>
            <button class="flex justify-between  bg-lime-300 m-2.5 w-[250px] p-1 hover:bg-lime-400">➡️ Port existing number<span> →</span></button>
        </div>

        <p class="text-[15px] text-center p-2.5 m-1.5">If you choose to port your existing number, you
            will be given a temporary OpenPhone number to
            test things out with during the porting process.</p>
    </div>
</body>
</html>
