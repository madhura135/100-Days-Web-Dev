<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-100 ">
     <div class="mb-1 pt-5.5 pb-5 ml-[40%] mt-1.5 w-[350px] h-[580px] bg-amber-300 text-center border-2 border-amber-600 rounded-3xl">
        <img src="https://picsum.photos/200/300" class="h-[350px] w-[250px] align-middle p-3.5 block mx-auto rounded-3xl">
        
        <p class="text-[20px] p-1.5 mb-1.5 font-bold">Check Your Email</p>
        <p class="text-[16px] p-1 mb-1">Enter the 6-digit code we just sent to</p>
        <p class="text-[16px] p-1 mb-1"><span class="font-bold">abcd@gmail.com</span> to continue.</p>

        <form>
            <input class="w-[270px] m-1.5 border border-amber-500 border-amber-600 rounded-lg px-4 py-1" type="text">
            <button class="m-1.5 p-1 w-[100px] bg-amber-500 rounded-lg font-bold hover:bg-amber-700 hover: text-amber-50">Continue</button>

        </form>
    </div>
    
</body>
</html>
