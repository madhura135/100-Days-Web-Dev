<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture-Ex</title>
    <style>
        .box{
            width:100px;
            height:100px;
            /* border-radius: 50%; */
            background-color: cadetblue;
            justify-content: center;
            align-items: center;
            transition: 6s;
            animation-name: new;
            animation-duration: 5s;
            animation-delay: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            animation-direction: alternate;
        }
        .box:hover{
            background-color: blue;
        }
        @keyframes new{
            from{}
            to{
                margin-left:calc(100% - 100px);
                background-color: red;
                transform: rotate(360deg);

            }
        }
        .loader{
            width:30px;
            height:30px;
            border:2px dotted rgba(0, 0, 0, 0.444);
            border-top:2px solid rgba(82, 81, 81, 0.918);
            border-radius: 50%;
            animation-name: loader;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            margin:auto;
        }
        @keyframes loader{
            from{}
            to{
                transform: rotate(360deg);
            }
        }
        .section{
            height:80vh;
            width:80vw;
            margin:auto;
            display: flex;
             align-items:center ;
             justify-content: center;
        }

    </style>
</head>
<body>
    <div class="box">

    </div>
    <div class="section">
            <div class="loader">

    </div>
    </div>

    
</body>
</html>
