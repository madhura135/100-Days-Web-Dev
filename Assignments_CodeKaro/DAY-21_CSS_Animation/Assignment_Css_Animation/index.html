<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation-assignment</title>
  <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-end; 
    }

    .box {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: rgb(103, 194, 198);
         animation: new 1s ease-in-out infinite;  /*name,duration,animation-timing-function,animation-iteration*/
    }

    @keyframes new {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-600px) scale(1.5);
        }
    }
</style>
</head>
<body>
    <div class="box">

    </div>
    
</body>
</html>
